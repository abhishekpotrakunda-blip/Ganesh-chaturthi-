<!DOCTYPE html>
<html>
<head>
    <title>Ganesh Chaturthi</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #fff3e0, #ffe0b2);
            color: #7b1f00;
        }

        header {
            padding: 50px 20px;
            background: #ff9800;
            color: white;
        }

        h1 {
            font-size: 42px;
            margin: 10px;
        }

        .ganesh {
            font-size: 100px;
        }

        section {
            padding: 30px 20px;
        }

        .card {
            max-width: 600px;
            margin: auto;
            padding: 25px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }

        footer {
            padding: 20px;
            background: #7b1f00;
            color: white;
        }
    </style>
</head>

<body>

<header>
    <div class="ganesh">🙏🐘</div>
    <h1>Happy Ganesh Chaturthi</h1>
    <p>Ganpati Bappa Morya! 🌺</p>
</header>

<section>
    <div class="card">
        <h2>🌸 Ganesh Chaturthi 🌸</h2>
        <p>
            May Lord Ganesha bless you with happiness,
            success, wisdom and prosperity.
        </p>

        <h2>✨ Ganpati Bappa Morya! ✨</h2>
    </div>
</section>

<footer>
    Made with ❤️ for Ganesh Chaturthi
</footer>

</body>
</html>
